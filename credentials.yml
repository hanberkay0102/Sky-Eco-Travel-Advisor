# ══════════════════════════════════════════════════════════════
# Credentials Configuration
# This file defines which messaging channels the bot uses.
# Each channel has its own settings for authentication.
# ══════════════════════════════════════════════════════════════

# REST Channel — allows any frontend to talk to the bot
# via HTTP POST requests. This is the simplest channel and
# works with Rasa Webchat, custom React frontends, or
# any tool that can send JSON over HTTP.
# No API key needed — it accepts all requests on localhost.
rest:

# Socket.IO Channel — enables real-time two-way messaging
# Used by Rasa Webchat widget (the chat bubble on a webpage).
# The frontend connects via WebSocket for instant responses
# without page refreshes.
socketio:
  user_message_evt: user_uttered
  bot_message_evt: bot_uttered
  session_persistence: false
