# STORY 7 - After Trip Summary Flows
# What the user does after seeing the trip summary.
# ==================================================

- story: search transport after trip summary
  steps:
    - action: action_trip_summary
    - intent: search_transport
    - action: action_search_transport

- story: search accommodation after trip summary
  steps:
    - action: action_trip_summary
    - intent: search_accommodation
    - action: action_search_accommodation

- story: ask carbon after trip summary
  steps:
    - action: action_trip_summary
    - intent: ask_carbon_footprint
    - action: action_calculate_carbon

- story: affirm after trip summary
  steps:
    - action: action_trip_summary
    - intent: affirm
    - action: action_search_transport

