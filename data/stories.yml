version: "3.1"

stories:

# ==================================================
# STORY 1 - Transport Search Flow
# User wants to search for transport options.
# ==================================================

- story: search transport with details
  steps:
    - intent: search_transport
    - action: action_search_transport
    - intent: provide_origin
    - action: action_search_transport

- story: search transport already has origin
  steps:
    - intent: search_transport
    - action: action_search_transport

# ==================================================
# STORY 2 - Compare Transport
# ==================================================

- story: compare transport options
  steps:
    - intent: compare_transport
    - action: action_compare_transport

# ==================================================
# STORY 3 - Accommodation Search
# ==================================================

- story: search accommodation
  steps:
    - intent: search_accommodation
    - action: action_search_accommodation

# ==================================================
# STORY 4 - Activities Search
# ==================================================

- story: search activities
  steps:
    - intent: search_activities
    - action: action_search_activities

