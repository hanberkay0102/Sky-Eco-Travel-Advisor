# ══════════════════════════════════════════════════════════════
# nginx config for HuggingFace Spaces
# Serves frontend on port 7860, proxies SocketIO to Rasa
# ══════════════════════════════════════════════════════════════

worker_processes 1;
pid /tmp/nginx.pid;
error_log /tmp/nginx_error.log warn;

events {
    worker_connections 128;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    access_log    /tmp/nginx_access.log;

    # Temp paths writable without root
    client_body_temp_path /tmp/client_body;
    proxy_temp_path       /tmp/proxy;
    fastcgi_temp_path     /tmp/fastcgi;
    uwsgi_temp_path       /tmp/uwsgi;
    scgi_temp_path        /tmp/scgi;

    server {
        listen 7860;
        server_name _;

        # Serve frontend static files
        location / {
            root /app/frontend;
            index index.html;
            try_files $uri $uri/ /index.html;
        }

        # Proxy Socket.IO to Rasa server
        location /socket.io/ {
            proxy_pass http://127.0.0.1:5005/socket.io/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400;
            proxy_send_timeout 86400;
        }

        # Proxy REST webhook to Rasa server
        location /webhooks/ {
            proxy_pass http://127.0.0.1:5005/webhooks/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
